---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-alerts
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      application: mcp-alerts
  template:
    metadata:
      labels:
        application: mcp-alerts
    spec:
      serviceAccountName: default-editor
      containers:
        - name: mcp-alerts
          image: "{{ .Values.mcpAlerts.repository }}:{{ .Values.mcpAlerts.tag }}"
          imagePullPolicy: Always
          ports:
          - containerPort: 3001
            protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: MCP_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mcp-mongo
                  key: uri
            - name: HISTORIAN_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: service_uri
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: DOMAIN
              value: {{ .Values.domain | quote }}
