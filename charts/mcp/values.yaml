domain: teknoir.cloud

mcpAlerts:
  repository: us-central1-docker.pkg.dev/teknoir-mgmt/apps/mcp-poc-alerts
  tag: latest

mcpAlertsEx:
  repository: us-central1-docker.pkg.dev/teknoir-mgmt/apps/mcp-poc-alerts
  tag: latest

mongo:
  image:
    repository: mongo
    tag: "8.0"
    pullPolicy: Always
  auth:
    username: teknoir
    password: change-me
  service:
    port: 27017
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
